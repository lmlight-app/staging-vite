# DigitalBase — docker compose 版 (= install-docker.sh と同じ構成を compose で。読める・差分管理できる・自前の基盤に取り込める)
#
#   mkdir -p digitalbase/data && cd digitalbase
#   curl -fsSL https://raw.githubusercontent.com/lmlight-app/staging-vite/main/scripts/docker-compose.yml -o docker-compose.yml
#   cp /path/to/license.lic data/license.lic      # 無ければ起動後に 管理画面 > ライセンス から upload
#   docker compose up -d
#   → http://localhost:8000
#
# 変えたい値は同じ dir の .env に書く (compose が読む):
#   APP_PORT=8000  LLM_BACKEND=ollama|vllm  DB_PASSWORD=...  DB_IMAGE_TAG=latest
#   OLLAMA_BASE_URL / VLLM_BASE_URL / VLLM_EMBED_BASE_URL (既定はホスト側の各サービス)
# JWT_SECRET と OAUTH_ENCRYPTION_KEY は未指定なら初回起動時に data/ に生成して永続する (= 作り直しても変わらない)。
# 固定したい時は app.environment に JWT_SECRET=<長い乱数> を足す。
# データは全部この dir の下 (data/ = アプリ、postgres-data/ = DB)。バックアップはこの dir ごと。
#
# 更新:   docker compose pull && docker compose up -d
# 停止:   docker compose down            (データは残る)
# 削除:   docker compose down -v && rm -rf data postgres-data

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: digitalbase
      POSTGRES_PASSWORD: ${DB_PASSWORD:-digitalbase}
      POSTGRES_DB: digitalbase
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalbase -d digitalbase"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    image: lmlight/digitalbase:${DB_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      # pgvector 拡張はアプリが起動時に CREATE EXTENSION する (この user は container 内の superuser)
      DATABASE_URL: postgresql://digitalbase:${DB_PASSWORD:-digitalbase}@db:5432/digitalbase
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8080}
      VLLM_EMBED_BASE_URL: ${VLLM_EMBED_BASE_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # ホストの Ollama / vLLM に container から届くように
    volumes:
      - ./data:/app/data                       # files/ license.lic mcp/ .env.jwt_secret
