# DigitalBase — docker compose
#
#   curl -fsSL https://pub-a2cab4360f1748cab5ae1c0f12cddc0a.r2.dev/vite-scripts/install-docker.sh | bash
#   → http://localhost:8000  (admin@local / admin123。初回ログイン後にパスワードを変える)
#
# 設定は同じ dir の .env (雛形: docker.env.example)。.env の全行がアプリに渡る。
# vLLM を同じ stack で動かす: .env の COMPOSE_PROFILES に cuda (NVIDIA) / rocm (AMD) / xpu (Intel) のどれか 1 つ。
# データ: data/ (ファイル・license.lic・鍵)、postgres-data/ (DB)、hf-cache/ (vLLM のモデル)。この dir ごとバックアップする。
# 更新: install-docker.sh を再実行 (または docker compose pull && docker compose up -d --remove-orphans)。要 Docker Compose v2.24 以降。

name: digitalbase

x-vllm: &vllm
  restart: unless-stopped
  ipc: host
  environment:
    HF_TOKEN: ${HF_TOKEN:-}
  volumes:
    - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
  healthcheck:
    test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
    interval: 15s
    timeout: 5s
    retries: 80
    start_period: 120s

x-vllm-chat-command: &vllm_chat_command
  - --model=${VLLM_CHAT_MODEL:-Qwen/Qwen3-1.7B}
  - --max-model-len=${LLM_CONTEXT_LENGTH:-32768}
  - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION_CHAT:-0.70}
  - --enable-auto-tool-choice
  - --tool-call-parser=${VLLM_TOOL_CALL_PARSER:-hermes}
  - --reasoning-parser=${VLLM_REASONING_PARSER:-qwen3}

x-vllm-embed-command: &vllm_embed_command
  - --model=${VLLM_EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}
  - --runner=pooling
  - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION_EMBED:-0.10}

x-cuda: &cuda
  image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-latest}
  profiles: [cuda]
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

x-rocm: &rocm
  image: vllm/vllm-openai-rocm:${VLLM_IMAGE_TAG:-latest}
  profiles: [rocm]
  devices:
    - /dev/kfd
    - /dev/dri
  group_add:
    - video
  cap_add:
    - SYS_PTRACE
  security_opt:
    - seccomp=unconfined

x-xpu: &xpu
  image: vllm/vllm-openai-xpu:${VLLM_IMAGE_TAG:-latest}
  profiles: [xpu]
  devices:
    - /dev/dri:/dev/dri
  privileged: true
  volumes:
    - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
    - /dev/dri/by-path:/dev/dri/by-path

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: digitalbase
      POSTGRES_PASSWORD: ${DB_PASSWORD:-digitalbase}
      POSTGRES_DB: digitalbase
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalbase -d digitalbase"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    image: lmlight/digitalbase:${DB_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      DATABASE_URL: ${DATABASE_URL:-postgresql://digitalbase:${DB_PASSWORD:-digitalbase}@db:5432/digitalbase}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8080}
      VLLM_EMBED_BASE_URL: ${VLLM_EMBED_BASE_URL:-http://host.docker.internal:8081}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data

  vllm-chat-cuda:
    <<: [*vllm, *cuda]
    command: *vllm_chat_command
    networks: {default: {aliases: [vllm-chat]}}
  vllm-embed-cuda:
    <<: [*vllm, *cuda]
    command: *vllm_embed_command
    networks: {default: {aliases: [vllm-embed]}}

  vllm-chat-rocm:
    <<: [*vllm, *rocm]
    command: *vllm_chat_command
    networks: {default: {aliases: [vllm-chat]}}
  vllm-embed-rocm:
    <<: [*vllm, *rocm]
    command: *vllm_embed_command
    networks: {default: {aliases: [vllm-embed]}}

  vllm-chat-xpu:
    <<: [*xpu, *vllm]
    command: *vllm_chat_command
    networks: {default: {aliases: [vllm-chat]}}
  vllm-embed-xpu:
    <<: [*xpu, *vllm]
    command: *vllm_embed_command
    networks: {default: {aliases: [vllm-embed]}}
